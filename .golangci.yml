run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam
    - gocritic
    - bodyclose
    - noctx
    - sqlclosecheck
    - gosec
    - goconst
    - prealloc
    - whitespace

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G404

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, dupl, errcheck]
    - path: cmd/
      linters: [unparam]
